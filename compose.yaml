name: kindlevel

services:
  kindlevel:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: kindlevel-dashboard:local
    ports:
      - "${KINDLEVEL_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      TZ: "${TZ:-UTC}"
      KINDLEVEL_PUBLIC_URL: "${KINDLEVEL_PUBLIC_URL:-}"
    volumes:
      - kindlevel-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  kindlevel-data:
