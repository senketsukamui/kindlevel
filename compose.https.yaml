services:
  kindlevel:
    environment:
      KINDLEVEL_PUBLIC_URL: "https://${KINDLEVEL_DOMAIN:?Set KINDLEVEL_DOMAIN to your public domain}"
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      KINDLEVEL_DOMAIN: "${KINDLEVEL_DOMAIN:?Set KINDLEVEL_DOMAIN to your public domain}"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
